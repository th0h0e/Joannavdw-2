<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Hide address bar on mobile for immersive experience -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    
    <!-- Preload the custom font to prevent FOUT -->
    <link rel="preload" href="/fonts/EnduroWeb-Medium.woff" as="font" type="font/woff" crossorigin="anonymous">
    
    <!-- Preload hero image for faster initial load -->
    <link rel="preload" href="/src/assets/Hero Image/Maria Bodil for Nike New Tech Fleece campaign copy.webp" as="image">

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Browser Detection - Set CSS Variables Immediately -->
    <script>
      (function() {
        // Browser detection
        const userAgent = navigator.userAgent.toLowerCase();
        const isSafari = userAgent.includes('safari') && !userAgent.includes('chrome') && !userAgent.includes('chromium');
        const isWebKit = 'webkitAppearance' in document.documentElement.style;
        const hasSafariFeatures = window.safari !== undefined;
        const isSafariBrowser = isSafari || (isWebKit && hasSafariFeatures);
        
        // Feature detection
        const supportsScrollState = CSS && CSS.supports && CSS.supports('container-type', 'scroll-state');
        
        // Set CSS custom properties on :root immediately
        const root = document.documentElement;
        root.style.setProperty('--is-safari', isSafariBrowser ? '1' : '0');
        root.style.setProperty('--supports-scroll-state', supportsScrollState ? '1' : '0');
        root.style.setProperty('--use-css-scroll-detection', !isSafariBrowser && supportsScrollState ? '1' : '0');
        
        // Set data attributes for JavaScript access
        root.setAttribute('data-browser-safari', isSafariBrowser.toString());
        root.setAttribute('data-supports-scroll-state', supportsScrollState.toString());
        
        // Debug log
        console.log('Browser Detection (Head):', {
          userAgent: navigator.userAgent,
          isSafari: isSafariBrowser,
          supportsScrollState: supportsScrollState,
          useCSSDection: !isSafariBrowser && supportsScrollState
        });
      })();
    </script>
    
    <title>Joanna van der Weg - Creative Strategy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
